<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration | Event registration 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        🎓 Event registration 2026
        <span>University Event Portal</span>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html" class="active">Register</a>
        <a href="staff-login.html">Staff Login</a>
    </nav>
</header>

<section class="register-section">

<form id="registerForm" class="register-box">

<h2>Student Registration</h2>

<!-- 1️⃣ Personal Details -->

<h3>1️⃣ Personal Details</h3>

<label>Full Name</label>
<input type="text" id="full_name" name="full_name" required>

<label>Registration Number</label>
<input type="text" id="reg_no" name="reg_no" required>

<label>Email</label>
<input type="email" id="email" name="email" required>

<label>Phone</label>
<input type="text" id="phone" name="phone" required>


<!-- 2️⃣ Academic Information -->

<h3>2️⃣ Academic Information</h3>

<label>Degree</label>
<select id="degree" name="degree" onchange="loadDepartments()" required>

<option value="">Select Degree</option>
<option value="BE">B.E</option>
<option value="BTECH">B.Tech</option>
<option value="ME">M.E</option>
<option value="MTECH">M.Tech</option>
<option value="MCA">MCA</option>
<option value="MBA">MBA</option>

</select>


<label>Department</label>
<select id="department" name="department" required>

<option value="">Select Department</option>

</select>
<label>Year of Passing</label>
<select id="year" name="year" required>

<option value="">Select Year</option>

<option value="2020">2020</option>
<option value="2021">2021</option>
<option value="2022">2022</option>
<option value="2023">2023</option>
<option value="2024">2024</option>
<option value="2025">2025</option>
<option value="2026">2026</option>

</select>



<label>Event Details</label>
<select id="event" onchange="openEvent()">

<option value="">Select Event</option>

<option value="convocation">
Convocation 2026
</option>

<option value="sports">
Sports Day 2026
</option>

<option value="annual">
Annual Day 2026
</option>

</select>

</form>

</section>


<footer class="footer">
<h4>🎓 Event registration 2026</h4>
<p>Celebrating academic excellence and the bright future of our graduates.</p>
</footer>


<script src="js/register.js"></script>

</body>
</html>
